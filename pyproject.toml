[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Intelligent Movie Recommendation Platform - systeme de recommandation de films (MovieLens)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Bornes larges ici ; les versions exactes, reellement installees ensemble,
# sont figees dans requirements.txt (genere par pip freeze).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "implicit>=0.7.2",
    "threadpoolctl>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests qui ont besoin du dataset reel telecharge",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]
